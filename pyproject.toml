[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "codex-accounts"
version = "0.2.0"
description = "Multi-account CLI manager for the OpenAI Codex desktop app"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "codex-accounts contributors" }]
keywords = [
    "codex",
    "chatgpt",
    "openai",
    "multi-account",
    "cli",
    "account-switcher",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
]

[project.scripts]
codex-accounts = "codex_switch.cli:main"

[project.urls]
Homepage = "https://github.com/wikty/codex-accounts"
Documentation = "https://github.com/wikty/codex-accounts#readme"
Issues = "https://github.com/wikty/codex-accounts/issues"
Source = "https://github.com/wikty/codex-accounts"
Changelog = "https://github.com/wikty/codex-accounts/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_switch"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/completions",
    "/packaging",
    "/scripts",
    "/install.sh",
    "/README.md",
    "/README.zh-CN.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF",
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
